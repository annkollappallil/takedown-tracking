name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test & Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Test Suite
        env:
          PYTHONPATH: src
        run: |
          pytest -v tests

      - name: Test CLI Pipeline with Synthetic Fixtures
        env:
          PYTHONPATH: src
        run: |
          python -m takedown_tracking.cli generate --count 100 --seed 42 --output synthetic_test.json
          python -m takedown_tracking.cli import --input synthetic_test.json
          python -m takedown_tracking.cli metrics --input synthetic_test.json
          python -m takedown_tracking.cli export-scoreboard --input synthetic_test.json --output scoreboard_test.json --k-threshold 10

  secret-scan:
    name: Preventive Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
